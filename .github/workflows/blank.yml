
name: Build AIMCHEAT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source ZIP
        run: |
          mkdir -p extracted
          unzip -o AIMCHEAT-GitHub-Build.zip -d extracted
          find extracted -type f | head -30

      - name: Locate Android project
        run: |
          FILE=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$FILE" ]; then
            echo "Không tìm thấy settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMCHEAT-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
